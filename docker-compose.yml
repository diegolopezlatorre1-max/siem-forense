services:
  postgres:
    image: postgres:16
    container_name: siem-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: siem-redis
    restart: unless-stopped
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: