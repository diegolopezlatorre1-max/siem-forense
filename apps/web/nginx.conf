server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta que no sea un archivo cae en index.html (history mode de vue-router).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API: mismo origen que la web, así la cookie de refresh (SameSite=Strict) funciona.
  # El prefijo global de la API es /api/v1, por eso se reenvía /api/ tal cual.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
