<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="'Segoe UI',Arial,sans-serif" font-size="13">
  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
  <text x="24" y="34" fill="#1f2933" font-size="16" font-weight="700">Figura 3 · El motor: ventana deslizante de LINUX-001 (umbral 5, ventana 60 s)</text>

  <!-- time axis -->
  <line x1="60" y1="150" x2="820" y2="150" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="820" y="170" text-anchor="end" fill="#718096" font-size="11">t (segundos)</text>

  <!-- events -->
  <g font-family="Consolas,monospace" font-size="11">
    <!-- 6 fails, one IP -->
    <g>
      <circle cx="120" cy="150" r="9" fill="#fde8e8" stroke="#c53030" stroke-width="1.5"/>
      <text x="120" y="130" text-anchor="middle" fill="#9b2c2c">t=0</text>
      <circle cx="220" cy="150" r="9" fill="#fde8e8" stroke="#c53030" stroke-width="1.5"/>
      <text x="220" y="130" text-anchor="middle" fill="#9b2c2c">t=11</text>
      <circle cx="330" cy="150" r="9" fill="#fde8e8" stroke="#c53030" stroke-width="1.5"/>
      <text x="330" y="130" text-anchor="middle" fill="#9b2c2c">t=23</text>
      <circle cx="430" cy="150" r="9" fill="#fde8e8" stroke="#c53030" stroke-width="1.5"/>
      <text x="430" y="130" text-anchor="middle" fill="#9b2c2c">t=38</text>
      <circle cx="540" cy="150" r="9" fill="#c53030" stroke="#c53030" stroke-width="1.5"/>
      <text x="540" y="130" text-anchor="middle" fill="#9b2c2c" font-weight="700">t=52</text>
      <circle cx="700" cy="150" r="9" fill="#fde8e8" stroke="#c53030" stroke-width="1.5"/>
      <text x="700" y="130" text-anchor="middle" fill="#9b2c2c">t=61</text>
    </g>
  </g>

  <!-- window bracket 0..52 -->
  <rect x="104" y="176" width="452" height="34" rx="6" fill="#fff4f4" stroke="#c53030" stroke-dasharray="4 3"/>
  <text x="330" y="198" text-anchor="middle" fill="#9b2c2c" font-size="12">5 fallos de la misma IP dentro de 60 s  →  se alcanza el umbral</text>

  <!-- alert emitted -->
  <path d="M540 159 V232" stroke="#c53030" stroke-width="1.4" marker-end="url(#a3)"/>
  <rect x="440" y="234" width="200" height="30" rx="6" fill="#c53030"/>
  <text x="540" y="254" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="12">ALERTA emitida (cantidad=5)</text>

  <!-- after reset note -->
  <rect x="660" y="176" width="150" height="34" rx="6" fill="#f0f2f5" stroke="#9aa5b1"/>
  <text x="735" y="197" text-anchor="middle" fill="#52606d" font-size="11">ventana vaciada;</text>
  <text x="735" y="226" text-anchor="middle" fill="#718096" font-size="11">t=61 inicia conteo nuevo</text>

  <text x="24" y="300" fill="#718096" font-size="12">Al llegar al umbral emite UNA alerta y vacía la ventana: 10 fallos seguidos producen 2 alertas, no 6. El worker</text>
  <text x="24" y="318" fill="#718096" font-size="12">además deduplica alertas con la misma regla y la misma clave (IP) dentro de la última ventana.</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c53030"/>
    </marker>
  </defs>
</svg>
